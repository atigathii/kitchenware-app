<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kitchenware Inventory System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0d1127 0%, #17133a 50%, #1f0f35 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(255, 255, 255, 0.07);
      --input-border: rgba(255, 255, 255, 0.15);
      
      /* Exact Screenshot Metric Colors */
      --color-blue: #2563eb;
      --color-green: #059669;
      --color-orange: #ea580c;
      --color-red: #dc2626;
      
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: #0d1127;
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 12px;
    }

    @media (min-width: 768px) {
      body { padding: 20px; }
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
    }

    /* --- SPLASH SCREEN --- */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d1127;
      background-image: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .splash-content {
      text-align: center;
      animation: pulse 1.2s ease-in-out infinite alternate;
    }

    .splash-logo { font-size: 3.5rem; margin-bottom: 8px; }
    .splash-title { font-size: 1.3rem; font-weight: 800; color: #fff; }
    .splash-loader {
      width: 26px; height: 26px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--color-blue);
      border-radius: 50%;
      margin: 16px auto 0;
      animation: spin 0.8s linear infinite;
    }

    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { from { transform: scale(0.96); } to { transform: scale(1.04); } }

    /* --- HEADER --- */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .header-icon { font-size: 1.5rem; }
    h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }

    @media (min-width: 768px) {
      .header-icon { font-size: 1.8rem; }
      h1 { font-size: 1.5rem; }
    }

    /* --- METRICS RESPONSIVE GRID --- */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    @media (min-width: 480px) {
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 1024px) {
      .metrics-grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
    }

    .metric-card {
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .m-blue { background: var(--color-blue); }
    .m-green { background: var(--color-green); }
    .m-orange { background: var(--color-orange); }
    .m-red { background: var(--color-red); }

    .metric-title {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.9;
    }

    .metric-value {
      font-size: 1.4rem;
      font-weight: 800;
      margin-top: 6px;
    }

    @media (min-width: 768px) {
      .metric-value { font-size: 1.6rem; }
    }

    /* --- MAIN RESPONSIVE LAYOUT --- */
    .app-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 992px) {
      .app-layout {
        grid-template-columns: 320px 1fr;
        gap: 20px;
      }
    }

    .glass-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(10px);
    }

    @media (min-width: 768px) {
      .glass-box { padding: 20px; }
    }

    .section-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* --- FORM ELEMENTS --- */
    .form-group { margin-bottom: 12px; }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
      -webkit-appearance: none;
    }

    input:focus, select:focus { border-color: var(--color-blue); }
    option { background: #17133a; color: white; }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--color-blue);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      margin-top: 4px;
    }

    /* --- DESKTOP TABLE VIEW --- */
    .table-container {
      width: 100%;
      overflow-x: auto;
      display: none;
    }

    @media (min-width: 768px) {
      .table-container { display: block; }
      .mobile-cards-container { display: none; }
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 0.78rem;
      color: var(--text-muted);
      padding: 10px;
      border-bottom: 1px solid var(--card-border);
      font-weight: 600;
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.85rem;
      vertical-align: middle;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .badge-ok { background: rgba(5, 150, 105, 0.2); color: #34d399; }
    .badge-low { background: rgba(220, 38, 38, 0.2); color: #f87171; }

    .action-btns { display: flex; gap: 6px; }

    .btn-act {
      padding: 7px 9px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .btn-green { background: var(--color-green); }
    .btn-orange { background: var(--color-orange); }
    .btn-red { background: var(--color-red); }

    /* --- MOBILE CARD VIEW (<768px) --- */
    .mobile-cards-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mobile-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px;
    }

    .mc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .mc-title { font-weight: 700; font-size: 0.9rem; }
    .mc-category { font-size: 0.72rem; color: var(--text-muted); }

    .mc-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .mc-actions {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 6px;
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-content">
      <div class="splash-logo">🍽️</div>
      <div class="splash-title">Kitchenware OS</div>
      <div class="splash-loader"></div>
    </div>
  </div>

  <div class="container">
    <header>
      <span class="header-icon">🍽️</span>
      <h1>Kitchenware Inventory System</h1>
    </header>

    <!-- Metrics Bar -->
    <div class="metrics-grid">
      <div class="metric-card m-blue">
        <div class="metric-title">Total Products</div>
        <div class="metric-value" id="total-items">0</div>
      </div>
      <div class="metric-card m-green">
        <div class="metric-title">Total Inventory Value</div>
        <div class="metric-value" id="total-val">KSh 0</div>
      </div>
      <div class="metric-card m-orange">
        <div class="metric-title">Profit Tracker</div>
        <div class="metric-value" id="total-profit">KSh 0</div>
      </div>
      <div class="metric-card m-red">
        <div class="metric-title">Low Stock Alerts</div>
        <div class="metric-value" id="low-stock-count">0</div>
      </div>
    </div>

    <!-- Main Content Workspace -->
    <div class="app-layout">
      <!-- Add Product Form -->
      <div class="glass-box">
        <div class="section-title">Add New Product</div>
        <form id="product-form" onsubmit="addProduct(event)">
          <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="p-name" placeholder="e.g. Non-Stick Frying Pan" required>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="p-category">
              <option value="Cookware">Cookware</option>
              <option value="Appliances">Appliances</option>
              <option value="Tableware">Tableware</option>
              <option value="Cutlery">Cutlery</option>
            </select>
          </div>
          <div class="form-group">
            <label>Buying Price (KSh)</label>
            <input type="number" id="p-buy" placeholder="1200" required>
          </div>
          <div class="form-group">
            <label>Selling Price (KSh)</label>
            <input type="number" id="p-sell" placeholder="1900" required>
          </div>
          <div class="form-group">
            <label>Initial Stock</label>
            <input type="number" id="p-qty" placeholder="10" required>
          </div>
          <button type="submit" class="btn-submit">+ Add Product</button>
        </form>
      </div>

      <!-- Inventory Stock View -->
      <div class="glass-box">
        <div class="section-title">
          <span>Current Stock List</span>
          <button style="background:none; border:none; color:var(--text-muted); font-size:0.75rem; cursor:pointer;" onclick="resetProfit()">Reset Profit</button>
        </div>

        <!-- Desktop Table View -->
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Prices</th>
                <th>Stock</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="inventory-table-body"></tbody>
          </table>
        </div>

        <!-- Mobile Card View -->
        <div class="mobile-cards-container" id="inventory-mobile-body"></div>
      </div>
    </div>
  </div>

  <script>
    // Hide Splash Screen
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('splash-screen').classList.add('fade-out');
      }, 1200);
    });

    const defaultData = [
      { id: 1, name: "Non-Stick Frying Pan 28cm", category: "Cookware", buy: 1200, sell: 1900, qty: 7, reorder: 5 },
      { id: 2, name: "1.5L Electric Blender", category: "Appliances", buy: 3500, sell: 5500, qty: 3, reorder: 5 },
      { id: 3, name: "Ceramic Dinner Plates", category: "Tableware", buy: 1800, sell: 2500, qty: 18, reorder: 5 }
    ];

    let inventory = JSON.parse(localStorage.getItem('kitchen_inv_final')) || defaultData;
    let totalSalesProfit = parseFloat(localStorage.getItem('kitchen_profit_final')) || 0;

    function renderInventory() {
      const tableBody = document.getElementById('inventory-table-body');
      const mobileBody = document.getElementById('inventory-mobile-body');
      
      tableBody.innerHTML = '';
      mobileBody.innerHTML = '';

      let totalItems = 0;
      let totalValue = 0;
      let lowStockCount = 0;

      inventory.forEach((item, index) => {
        totalItems += 1;
        totalValue += (item.sell * item.qty);

        const isLow = item.qty <= item.reorder;
        if (isLow) lowStockCount += 1;

        // Desktop Table Rows
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.name}</strong></td>
          <td style="color:var(--text-muted);">${item.category}</td>
          <td>
            <div style="font-size:0.75rem; color:var(--text-muted);">Cost: KSh ${item.buy}</div>
            <strong style="color:#60a5fa;">Sell: KSh ${item.sell}</strong>
          </td>
          <td><strong>${item.qty} pcs</strong></td>
          <td>
            <span class="badge ${isLow ? 'badge-low' : 'badge-ok'}">
              ${isLow ? '⚠️ Low Stock' : '✓ In Stock'}
            </span>
          </td>
          <td>
            <div class="action-btns">
              <button class="btn-act btn-green" onclick="sellItem(${index})">🛒 -1</button>
              <button class="btn-act btn-orange" onclick="restockItem(${index})">📦 +1</button>
              <button class="btn-act btn-red" onclick="deleteItem(${index})">🗑️</button>
            </div>
          </td>
        `;
        tableBody.appendChild(tr);

        // Mobile Cards
        const mCard = document.createElement('div');
        mCard.className = 'mobile-card';
        mCard.innerHTML = `
          <div class="mc-header">
            <div>
              <div class="mc-title">${item.name}</div>
              <div class="mc-category">${item.category}</div>
            </div>
            <span class="badge ${isLow ? 'badge-low' : 'badge-ok'}">
              ${isLow ? '⚠️ Low' : '✓ OK'}
            </span>
          </div>
          <div class="mc-body">
            <div>Cost: KSh ${item.buy} | <strong style="color:#60a5fa;">Sell: KSh ${item.sell}</strong></div>
            <div><strong>${item.qty} pcs</strong></div>
          </div>
          <div class="mc-actions">
            <button class="btn-act btn-green" style="justify-content:center;" onclick="sellItem(${index})">🛒 -1 Sale</button>
            <button class="btn-act btn-orange" style="justify-content:center;" onclick="restockItem(${index})">📦 +1 Stock</button>
            <button class="btn-act btn-red" style="justify-content:center;" onclick="deleteItem(${index})">🗑️</button>
          </div>
        `;
        mobileBody.appendChild(mCard);
      });

      document.getElementById('total-items').innerText = totalItems;
      document.getElementById('total-val').innerText = `KSh ${totalValue.toLocaleString()}`;
      document.getElementById('total-profit').innerText = `KSh ${totalSalesProfit.toLocaleString()}`;
      document.getElementById('low-stock-count').innerText = lowStockCount;

      localStorage.setItem('kitchen_inv_final', JSON.stringify(inventory));
      localStorage.setItem('kitchen_profit_final', totalSalesProfit);
    }

    function addProduct(e) {
      e.preventDefault();
      const newItem = {
        id: Date.now(),
        name: document.getElementById('p-name').value,
        category: document.getElementById('p-category').value,
        buy: parseFloat(document.getElementById('p-buy').value),
        sell: parseFloat(document.getElementById('p-sell').value),
        qty: parseInt(document.getElementById('p-qty').value),
        reorder: 5
      };

      inventory.push(newItem);
      renderInventory();
      document.getElementById('product-form').reset();
    }

    function sellItem(index) {
      if (inventory[index].qty > 0) {
        inventory[index].qty -= 1;
        totalSalesProfit += (inventory[index].sell - inventory[index].buy);
        renderInventory();
      } else {
        alert("Out of stock!");
      }
    }

    function restockItem(index) {
      inventory[index].qty += 1;
      renderInventory();
    }

    function deleteItem(index) {
      if (confirm(`Delete "${inventory[index].name}"?`)) {
        inventory.splice(index, 1);
        renderInventory();
      }
    }

    function resetProfit() {
      if (confirm("Reset profit counter?")) {
        totalSalesProfit = 0;
        renderInventory();
      }
    }

    renderInventory();
  </script>
</body>
</html>
