<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchenware Inventory System</title>
  <style>
    /* Animated Dynamic Background */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 25px;
      min-height: 100vh;
      color: #f8fafc;
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #311042, #0284c7);
      background-size: 400% 400%;
      animation: gradientBg 15s ease infinite;
    }

    @keyframes gradientBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }

    /* Vibrant Metric Cards */
    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: transform 0.2s ease;
    }

    .card:hover { transform: translateY(-3px); }

    .card-blue { background: linear-gradient(135deg, rgba(37, 99, 235, 0.8), rgba(29, 78, 216, 0.6)); }
    .card-green { background: linear-gradient(135deg, rgba(22, 163, 74, 0.8), rgba(21, 128, 61, 0.6)); }
    .card-orange { background: linear-gradient(135deg, rgba(234, 88, 12, 0.8), rgba(194, 65, 12, 0.6)); }
    .card-red { background: linear-gradient(135deg, rgba(220, 38, 38, 0.8), rgba(185, 28, 28, 0.6)); }

    .card h3 {
      margin: 0;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .card .value {
      font-size: 1.8rem;
      font-weight: 800;
      margin-top: 10px;
    }

    /* Main Split Screen with Glassmorphism */
    .main-content {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 25px;
    }

    @media (max-width: 900px) {
      .main-content { grid-template-columns: 1fr; }
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.37);
    }

    .glass-panel h3 {
      margin-top: 0;
      font-size: 1.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
      margin-bottom: 18px;
    }

    /* Inputs & Form Elements */
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; opacity: 0.9; }

    input, select {
      width: 100%;
      padding: 11px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      box-sizing: border-box;
      outline: none;
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      border-color: #38bdf8;
      background: rgba(255, 255, 255, 0.12);
    }

    option { background: #0f172a; color: white; }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-submit:hover { opacity: 0.95; }

    /* Modern Table */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px; text-align: left; font-size: 0.9rem; }

    th {
      background: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      font-weight: 600;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    }

    td { border-bottom: 1px solid rgba(255, 255, 255, 0.07); }

    .badge {
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-ok { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .badge-low { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* Action Buttons */
    .actions-flex { display: flex; gap: 6px; }

    .act-btn {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    .btn-sale { background: #16a34a; }
    .btn-damage { background: #ea580c; }
    .btn-del { background: #dc2626; }
    .act-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🍽️ Kitchenware Inventory System</h1>

    <!-- Metric Overview Cards -->
    <div class="metrics">
      <div class="card card-blue">
        <h3>Total Products</h3>
        <div class="value" id="total-items">0</div>
      </div>
      <div class="card card-green">
        <h3>Total Inventory Value</h3>
        <div class="value" id="total-val">KSh 0</div>
      </div>
      <div class="card card-orange">
        <h3>Profit Tracker</h3>
        <div class="value" id="total-profit">KSh 0</div>
      </div>
      <div class="card card-red">
        <h3>Low Stock Alerts</h3>
        <div class="value" id="low-stock-count">0</div>
      </div>
    </div>

    <div class="main-content">
      <!-- Add Product Form -->
      <div class="glass-panel">
        <h3>Add New Product</h3>
        <form id="product-form" onsubmit="addProduct(event)">
          <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="p-name" placeholder="e.g. Non-Stick Frying Pan" required>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="p-category">
              <option value="Cookware">Cookware</option>
              <option value="Appliances">Appliances</option>
              <option value="Tableware">Tableware</option>
              <option value="Cutlery">Cutlery</option>
            </select>
          </div>
          <div class="form-group">
            <label>Buying Price (KSh)</label>
            <input type="number" id="p-buy" placeholder="1200" required>
          </div>
          <div class="form-group">
            <label>Selling Price (KSh)</label>
            <input type="number" id="p-sell" placeholder="2000" required>
          </div>
          <div class="form-group">
            <label>Initial Quantity</label>
            <input type="number" id="p-qty" placeholder="10" required>
          </div>
          <div class="form-group">
            <label>Reorder Alert Level</label>
            <input type="number" id="p-reorder" value="5" required>
          </div>
          <button type="submit" class="btn-submit">Save Product</button>
        </form>
      </div>

      <!-- Current Inventory Table -->
      <div class="glass-panel">
        <h3>Current Stock List</h3>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Prices</th>
                <th>Stock</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="inventory-list"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const defaultData = [
      { id: 1, name: "Non-Stick Frying Pan 28cm", category: "Cookware", buy: 1200, sell: 1900, qty: 7, reorder: 5 },
      { id: 2, name: "1.5L Electric Blender", category: "Appliances", buy: 3500, sell: 5500, qty: 3, reorder: 5 },
      { id: 3, name: "Ceramic Dinner Plates (6pcs)", category: "Tableware", buy: 1800, sell: 3000, qty: 18, reorder: 5 }
    ];

    let inventory = JSON.parse(localStorage.getItem('kitchen_inventory_v2')) || defaultData;
    let totalSalesProfit = parseFloat(localStorage.getItem('kitchen_profit')) || 0;

    function renderInventory() {
      const list = document.getElementById('inventory-list');
      list.innerHTML = '';

      let totalItems = 0;
      let totalValue = 0;
      let lowStockCount = 0;

      inventory.forEach((item, index) => {
        totalItems += 1;
        totalValue += (item.sell * item.qty);

        const isLow = item.qty <= item.reorder;
        if (isLow) lowStockCount += 1;

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${item.name}</strong></td>
          <td><span style="opacity:0.8">${item.category}</span></td>
          <td>
            <div style="font-size:0.8rem; opacity:0.7">Cost: KSh ${item.buy}</div>
            <div style="color:#38bdf8; font-weight:bold">Sell: KSh ${item.sell}</div>
          </td>
          <td><strong style="font-size:1.1rem">${item.qty}</strong> <small>pcs</small></td>
          <td>
            <span class="badge ${isLow ? 'badge-low' : 'badge-ok'}">
              ${isLow ? '⚠️ Low Stock' : '✓ In Stock'}
            </span>
          </td>
          <td>
            <div class="actions-flex">
              <button class="act-btn btn-sale" onclick="sellItem(${index})" title="Record Sale">🛒 -1</button>
              <button class="act-btn btn-damage" onclick="logDamage(${index})" title="Record Damaged Item">💔 -1</button>
              <button class="act-btn btn-del" onclick="deleteItem(${index})">🗑️</button>
            </div>
          </td>
        `;
        list.appendChild(tr);
      });

      document.getElementById('total-items').innerText = totalItems;
      document.getElementById('total-val').innerText = `KSh ${totalValue.toLocaleString()}`;
      document.getElementById('total-profit').innerText = `KSh ${totalSalesProfit.toLocaleString()}`;
      document.getElementById('low-stock-count').innerText = lowStockCount;

      localStorage.setItem('kitchen_inventory_v2', JSON.stringify(inventory));
      localStorage.setItem('kitchen_profit', totalSalesProfit);
    }

    function addProduct(e) {
      e.preventDefault();
      const newItem = {
        id: Date.now(),
        name: document.getElementById('p-name').value,
        category: document.getElementById('p-category').value,
        buy: parseFloat(document.getElementById('p-buy').value),
        sell: parseFloat(document.getElementById('p-sell').value),
        qty: parseInt(document.getElementById('p-qty').value),
        reorder: parseInt(document.getElementById('p-reorder').value)
      };

      inventory.push(newItem);
      renderInventory();
      document.getElementById('product-form').reset();
    }

    function sellItem(index) {
      if (inventory[index].qty > 0) {
        inventory[index].qty -= 1;
        // Add profit margin (Sell Price - Buy Price)
        const profitMade = inventory[index].sell - inventory[index].buy;
        totalSalesProfit += profitMade;
        renderInventory();
      } else {
        alert("Item is out of stock!");
      }
    }

    function logDamage(index) {
      if (inventory[index].qty > 0) {
        inventory[index].qty -= 1;
        renderInventory();
      } else {
        alert("No stock available to mark as damaged.");
      }
    }

    function deleteItem(index) {
      inventory.splice(index, 1);
      renderInventory();
    }

    renderInventory();
  </script>
</body>
</html>
